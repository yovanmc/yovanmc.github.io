const T_CUT=4700, FLIP0=6600, FLIP1=7800, T_TOUCH=8400;

const RIP_START=[8400,9300,10200], RIP_DUR=1800;

const LAND_S=2.6, FALL_S=3.4;
const clamp01=x=>x<0?0:x>1?1:x;

const easeIO=x=>{x=clamp01(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};

  return { lt: B0+(B1-B0)*i/NB,
           a0: (i*55)%360,
           arc: 120+((i*13)%70),

           big: ((i*7)%3),

}
function computeState(t){
  const st={t:t};
  st.shot = t<T_CUT?1:2;
  const p1=clamp01(t/T_CUT);
  st.rays = (t<1200? t/1200*.09 : .09) * (t>4400? clamp01((T_CUT-t)/300):1) * (st.shot===1?1:0);
  st.glow = st.shot===1? .12*clamp01((t-3800)/900) : 0;
  st.motes=[];
  for(let i=0;i<12;i++){
    const speed=260+(i*53)%160, x=40+(i*97)%1080;
    let y=(((i*191)%688)-t*speed/1000)%688; if(y<0)y+=688;

  st.heroFall={x:SCX+sway, y:170+62*p1, rot:180, s:FALL_S, frame:0, on:st.shot===1};
  const p2=easeOut((t-T_CUT)/(T_TOUCH-T_CUT));
  st.station={s: t<T_CUT? .6 : .6+.4*p2};
  st.reveal={r: RV_MAX*easeIO((t-RV0)/(RV1-RV0))};
  const hs=LAND_S*(1.8-0.8*(t<T_CUT?0:p2));

    op: t<T_TOUCH? .45*clamp01((t-T_CUT)/1000) : .45*clamp01((T_TOUCH+300-t)/300),
    s: .4+.6*p2};

    const q=(t-s0)/RIP_DUR;

  st.skipHint = t<T_END*0.9? 1 : 0;

  $('hf0').style.display=hf.frame===0?'block':'none';
  $('hf1').style.display=hf.frame===1?'block':'none';
  $('stWrap').style.transform='scale('+st.station.s+')';
  $('stLit').style.clipPath='circle('+st.reveal.r+'px at 320px 320px)';
  const hl=st.heroLand;
  $('heroLand').style.transform='translate('+hl.x+'px,'+hl.y+'px) scale('+hl.s+') rotate('+hl.rot+'deg)';
  $('hl0').style.display=hl.frame===0?'block':'none';
  $('hl1').style.display=hl.frame===1?'block':'none';
  $('shadow').style.opacity=st.shadow.on?st.shadow.op:0;
  $('shadow').style.left=SCX+'px'; $('shadow').style.top=SCY+'px';
  $('shadow').style.transform='scale('+st.shadow.s+')';
  st.ripples.forEach((rp,i)=>{
    const e=$('rip'+i);
    if(!rp.on){e.style.opacity=0;return;}
    e.style.opacity=rp.op;
    e.style.left=(SCX-rp.r)+'px'; e.style.top=(SCY-rp.r)+'px';
    e.style.width=(2*rp.r)+'px'; e.style.height=(2*rp.r)+'px';
  });
  st.birds.forEach((b,i)=>{
    const e=birdEls[i];
    if(!b.on){e.w.style.opacity=0;return;}
    e.w.style.opacity=b.op;
    e.w.style.transform='translate('+b.x+'px,'+b.y+'px) rotate('+b.rot+'deg)';
    e.p0.style.display=b.flap===0?'block':'none';
    e.p1.style.display=b.flap===1?'block':'none';
  });
  $('menu').style.opacity=st.menu.op;
  $('menu').style.transform='translateY('+st.menu.dy+'px)';
  $('atmo').style.opacity=st.atmo;
  $('skipHint').style.opacity=st.skipHint;
}
const frozen=(location.search.match(/[?&]t=(\d+)/)||[])[1];
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(frozen!==undefined){
  applyState(computeState(parseInt(frozen,10)));
  document.body.style.borderTop='10px solid #00ff00';
}else if(reduced){
  applyState(computeState(T_END));
  document.body.style.borderTop='10px solid #00ff00';
}else{
  let start=performance.now(), painted=false;
  function skip(){const now=performance.now(); if(now-start<T_END) start=now-T_END;}
  document.getElementById('stage').addEventListener('click',skip);
  window.addEventListener('keydown',skip);
  function loop(now){
    applyState(computeState(now-start));
    if(!painted){painted=true;document.body.style.borderTop='10px solid #00ff00';}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>
