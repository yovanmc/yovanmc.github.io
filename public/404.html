<!doctype html>
<meta charset="utf-8" />
<title>Yovan — Backend Software Engineer</title>
<script>
  // Path-preserving SPA fallback (M3): stash the requested path so the app can
  // restore it after the redirect — a recovered deep link bypasses the intro,
  // same as a direct one. Never discard the path (the pre-M3 version did).
  try {
    sessionStorage.setItem("dl", location.pathname + location.search);
  } catch (e) {}
  location.replace("/");
</script>
